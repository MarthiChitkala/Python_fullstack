<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Login</title>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="brand">
                <div class="brand-mark">N</div>
                <div>
                    <h1>Student Login</h1>
                    <p>Learn • Practice • Get Placed</p>
                </div>
                <button class="nav-toggle" aria-label="Open menu">☰</button>
            </div>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a class="active" href="/about">About</a>

                <a href="/trainers">Trainers</a>

                <a href="/login">Login</a>

            </nav>
        </div>

    <main class="container">
        <section class="form-card">
            <h3>Welcome Back</h3>
            <p>Access your learning dashboard and continue your journey.</p>
            <form id="loginForm" method="POST">
            </form>>
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" placeholder="Enter your email" required>

                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
                <p class="form-message" id="loginMessage"></p>
            </form>
        </section>
    </main>

    <footer>

        </div>
