<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Register</title>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="brand">
                <div class="brand-mark">N</div>
                <div>
                    <h1>Register Now</h1>
                    <p>Learn • Practice • Get Placed</p>
                </div>
                <button class="nav-toggle" aria-label="Open menu">☰</button>
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="courses.html">Courses</a>
                <a href="trainers.html">Trainers</a>
                <a class="active" href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-card">
            <h3>Student Registration</h3>
            <p>Secure your seat in the next batch by completing the form below.</p>
            <form id="registerForm">
                <label for="name">Full Name</label>
                <input id="name" type="text" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" required>

                <label for="dob">Date of Birth</label>
                <input id="dob" type="date" required>

                <label>Gender</label>
                <div class="button-row">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>

                <label for="course">Select Course</label>
                <select id="course">
                    <option>Python Full Stack</option>
                    <option>Web Development</option>
                    <option>Data Structures</option>
                </select>

                <button type="submit">Register</button>
                <p class="form-message" id="registerMessage"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 NRIIT Learning Management System</p>
            <p>Email: info@nriit.edu | Phone: +91 9876543210</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
